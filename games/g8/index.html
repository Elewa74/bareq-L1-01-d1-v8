<title>بارق · اِلْعَبْ</title>
<style>
html, body, #canvas { margin:0; padding:0; border:0; }
html, body { width:100%; height:100%; overflow:hidden; background:#2a1c12; touch-action:none; }
body { display:flex; align-items:center; justify-content:center; }
/* the game fills the whole screen (the design frame is centred inside by the engine; the rest is the scene's own
   background continued) — so no black bars; the loader covers the same full screen from the first paint */
/* v5: landscape board 1920:1080 (16:9), as big as the screen allows, centred */
#canvas, #loader { width:min(100vw, calc(100vh * 1920 / 1080)); height:min(100vh, calc(100vw * 1080 / 1920)); }
@supports (height: 100dvh) { #canvas, #loader { width:min(100vw, calc(100dvh * 1920 / 1080)); height:min(100dvh, calc(100vw * 1080 / 1920)); } }
#canvas { display:block; }
#canvas:focus { outline:none; }
#loader { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 40%, #3aa6f2 0%, #1f8fe0 55%, #1576c4 100%); z-index:10; font-family:Tahoma, Arial, sans-serif; }
#loader .logo { display:flex; align-items:center; gap:12px; direction:ltr; }
#loader .bq { width:min(34vw,170px); animation:hop 1.1s ease-in-out infinite; transform-origin:50% 100%; }
#loader .tx { width:min(26vw,130px); }
#loader .bar { margin-top:28px; width:min(62vw,320px); height:18px; border-radius:12px; background:rgba(255,255,255,.28);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.15); overflow:hidden; }
#loader .fill { height:100%; width:6%; border-radius:12px; background:linear-gradient(#ffd452,#f7a21b); transition:width .2s; }
#loader .msg { margin-top:14px; color:#fff; font-size:18px; text-shadow:0 1px 2px rgba(0,0,0,.25); }
#loader .err { display:none; margin-top:16px; width:min(84vw,360px); background:#fff7e6; color:#5a2a00; border-radius:18px; padding:16px 16px 12px; text-align:center;
  box-shadow:0 8px 24px rgba(0,30,60,.25); font-family:Tahoma, Arial, sans-serif; }
#loader .err p { margin:0 0 12px; font-size:17px; line-height:1.5; }
#loader .err button { display:block; width:100%; min-height:56px; border:0; border-radius:999px; background:#ffd452; color:#00345b; font:700 20px/1.2 Tahoma, Arial, sans-serif;
  box-shadow:0 4px 0 #e0a100; cursor:pointer; touch-action:manipulation; }
#loader .err button:focus-visible { outline:3px solid #00345b; outline-offset:3px; }
#loader .err code { display:block; margin-top:10px; direction:ltr; text-align:left; font:11px/1.35 ui-monospace, Menlo, Consolas, monospace; color:#7a5a3a;
  word-break:break-word; max-height:6.8em; overflow:hidden; opacity:.85; }
#loader.is-err .bq { animation:none; } #loader.is-err .bar { display:none; }
@keyframes hop { 0%,100%{transform:translateY(0) scale(1,1)} 40%{transform:translateY(-16px) scale(.97,1.04)} 55%{transform:translateY(0) scale(1.05,.95)} }
</style>

<script>
/* بارق: معاملات المحطّة تصل بعد # (أثبت في بيئة النشر) فتُنقل إلى ?station=… قبل بدء المحرّك */
(function () { try { var h = location.hash.slice(1); if (h && /station=/.test(h) && !location.search) history.replaceState(null, '', location.pathname + '?' + h); } catch (e) {} })();
</script>
<script>
/* بارق: ملفّا البيانات يُنشران بامتداد .wasm (index.pck.wasm · index.gz.wasm) لأن منصّة النشر لا تقبل .pck/.gz — إعادة توجيه الأسماء */
(function () {
  if (!window.fetch) return;
  var f0 = window.fetch.bind(window);
  var map = { 'index.pck': 'index.pck.wasm', 'index.wasm.gz': 'index.gz.wasm' };
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || String(input);
    var clean = url.split('?')[0].split('#')[0], name = clean.split('/').pop();
    if (map[name]) return f0(clean.slice(0, clean.length - name.length) + map[name], init);
    return f0(input, init);
  };
})();
</script>
<script>
/* the activity keeps the exact frame (v5: 1920x1080): canvas box = CSS above, backing store = box x devicePixelRatio,
   capped at 2 (phones report 3: a 3x backing store costs ~2.3x the GPU memory for no visible gain at this art size — iOS) */
(function () {
  var cv = document.getElementById('canvas');
  function fit() {
    var r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  }
  fit(); window.addEventListener('resize', fit);
})();
</script>
<script>
/* ---- one failure path for everything (v0-12, iOS/iPadOS) ----
   bareqFail(err) shows a short message + a big «العودة إلى الدرس» button + a small LTR technical line, tells the lesson
   page {bq:'error', fatal:true} (it switches to the HTML version by itself) and remembers the failure for this browser
   session (sessionStorage «bq-godot-fail», read by the page's BQ.ui.godotOK()) so the other elements go straight to HTML.
   Sources: Engine.getMissingFeatures · startGame rejection · uncaught errors / rejections before start (e.g. a failed
   WebAssembly.instantiateStreaming, which Godot's loader does not catch) · a wasm trap/abort after start (OOM …) ·
   WebGL context loss (Godot only alert()s) · a non-zero engine exit. */
(function () {
  var started = false, failed = false;
  window.bareqStarted = function () { started = true; };
  function q(k) { try { return new URLSearchParams(location.search || location.hash.slice(1)).get(k) || ''; } catch (e) { return ''; } }
  var EL = { E10: 'E10' };
  function detail(err) {
    var m = !err ? 'unknown' : (err.name && err.message ? err.name + ': ' + err.message : String(err.message || err));
    m = String(m).split('\n')[0].slice(0, 160);
    var ua = navigator.userAgent, os = (ua.match(/(iPad|iPhone|Android|Mac OS X|Windows NT|Linux)[^;)]*/) || [''])[0];
    var v = (ua.match(/(Version|CriOS|Chrome|Firefox|FxiOS|EdgiOS)\/[\d.]+/) || [''])[0];
    var mem = '';
    try { if (window.__bqMem) mem = ' · heap ' + Math.round(window.__bqMem.buffer.byteLength / 1048576) + 'MB'; } catch (e) {}
    return m + ' · ' + os.replace(/(\d)_(\d)/g, '$1.$2') + ' ' + v + mem + (navigator.maxTouchPoints > 1 ? ' · touch' : '');
  }
  window.bareqFail = function (err, why) {
    if (failed) return; failed = true;
    try { console.error('[bq] game failed:', why || '', err); } catch (e) {}
    var d = detail(err);
    var embedded = window.parent && window.parent !== window;
    try { sessionStorage.setItem('bq-godot-fail', JSON.stringify({ t: Date.now(), why: why || 'error', d: d })); } catch (e) {}
    try { if (embedded) window.parent.postMessage({ bq: 'error', fatal: true, why: why || 'error', message: d, station: q('station') }, '*'); } catch (e) {}
    var loader = document.getElementById('loader');
    if (!loader) {        // the loader is gone (the game had started): bring it back as the error screen
      loader = document.createElement('div'); loader.id = 'loader';
      loader.innerHTML = '<div class="msg" id="msg"></div><div class="err" id="err"></div>'; document.body.appendChild(loader);
    }
    loader.style.opacity = '1'; loader.classList.add('is-err');
    var msg = document.getElementById('msg'); if (msg) msg.style.display = 'none';
    var box = document.getElementById('err');
    box.innerHTML = '';
    var p = document.createElement('p'); p.textContent = 'تعذّر تشغيل اللعبة على هذا الجهاز. النسخة الخفيفة من النشاط تعمل في الدرس.';
    var b = document.createElement('button'); b.type = 'button'; b.textContent = 'العودة إلى الدرس';
    b.onclick = function () {
      if (embedded) { try { window.parent.postMessage({ bq: 'error', fatal: true, why: 'back', station: q('station') }, '*'); } catch (e) {} return; }
      location.href = '../../index.html' + (EL[q('station')] ? '#' + EL[q('station')] : '');
    };
    var c = document.createElement('code'); c.textContent = d;
    box.appendChild(p); box.appendChild(b); box.appendChild(c); box.style.display = 'block';
    try { b.focus(); } catch (e) {}
  };
  function fatal(e) {
    var m = String(e && (e.message || e) || '');
    return !started || /RuntimeError|Aborted|out of memory|Out of bounds|unreachable|memory access/i.test(m) || (e && e.name === 'RuntimeError');
  }
  window.addEventListener('error', function (ev) { var e = ev.error || ev.message; if (fatal(e)) window.bareqFail(e, 'error'); });
  window.addEventListener('unhandledrejection', function (ev) { if (fatal(ev.reason)) window.bareqFail(ev.reason, 'rejection'); });
  var al = window.alert;   // Godot reports a lost WebGL context with alert() — on iOS that is memory pressure: no dead modal, the error screen
  window.alert = function (m) { if (/WebGL context lost/i.test(String(m))) { window.bareqFail(new Error('WebGL context lost'), 'webgl-lost'); return; } return al.apply(window, arguments); };
  /* the engine memory, for the technical line (and the tests) */
  ['instantiateStreaming', 'instantiate'].forEach(function (k) {
    var f = window.WebAssembly && WebAssembly[k]; if (!f) return;
    WebAssembly[k] = function () {
      return f.apply(this, arguments).then(function (r) {
        try { var x = (r.instance || r).exports; for (var n in x) if (x[n] instanceof WebAssembly.Memory) window.__bqMem = x[n]; } catch (e) {}
        return r;
      });
    };
  });
})();
</script>
<script>
/* ---- faster ONLINE loading (v0-12: streaming, WebKit-safe) ----
   1) the Godot engine (index.wasm, ~40 MB) is published compressed (index.gz.wasm, ~10 MB) and unpacked in the browser
      with DecompressionStream as a STREAM — no 40 MB ArrayBuffer copies in JS (v0-11 held 2–3 copies at once: iOS memory).
   2) the unpacked stream is written straight into the Cache API under ONE shared key and the engine is then served from
      that cache entry, so every other Bareq activity on the same site starts without downloading the engine again.
   No DecompressionStream / no streams / no Cache → the plain gz-less path (index.wasm) or a stream without cache.
   GitHub Pages also gzips *.wasm on the wire by itself (Content-Encoding: gzip), so index.gz.wasm costs ~10 MB once. */
window.bareqOnline = function () {
  window.BAREQ_ONLINE = true;   // the plain gz shim further down stands aside: this wrapper handles index.wasm itself (gz + cache)
  var WASM_SIZE = 39514754;
  var KEY = location.origin + '/__bareq_engine__/godot-4.7.2-' + WASM_SIZE + '.wasm';
  var nativeFetch = window.fetch.bind(window);
  var canStream = typeof DecompressionStream === 'function' && typeof ReadableStream === 'function' && !!ReadableStream.prototype.pipeThrough;
  function nameOf(u) { return String(u).split('/').pop().split('?')[0].split('#')[0]; }
  function headers() { return { 'Content-Type': 'application/wasm', 'Content-Length': String(WASM_SIZE) }; }
  window.bareqProgress = window.bareqProgress || function () {};
  function gz(url) {
    // compressed engine → decompressed stream Response (download progress = compressed bytes)
    return nativeFetch(url + '.gz').then(function (r) {
      if (!r.ok || !r.body) throw new Error('gz ' + r.status);
      var total = +r.headers.get('Content-Length') || 10100000, got = 0, rd = r.body.getReader();
      var counted = new ReadableStream({ pull: function (ctl) {
        return rd.read().then(function (x) {
          if (x.done) { ctl.close(); return; }
          got += x.value.length; window.bareqProgress('dl', Math.min(1, got / total));
          ctl.enqueue(x.value);
        });
      } });
      return new Response(counted.pipeThrough(new DecompressionStream('gzip')), { status: 200, headers: headers() });
    });
  }
  function plain(url) { return nativeFetch(url); }
  function engine(url) {
    if (!canStream) return plain(url);
    var open = window.caches && window.isSecureContext !== false ? caches.open('bareq-engine').catch(function () { return null; }) : Promise.resolve(null);
    return open.then(function (c) {
      if (!c) return gz(url).catch(function () { return plain(url); });
      return c.match(KEY).catch(function () { return null; }).then(function (hit) {
        if (hit) { window.bareqProgress('dl', 1); return hit; }
        return gz(url).then(function (resp) {
          // stream → cache (no JS copy), then serve the cached entry; a cache failure (quota, private mode) → stream again
          return c.put(KEY, resp).then(function () { return c.match(KEY); }).then(function (r) {
            if (!r) throw new Error('cache miss after put');
            return r;
          }).catch(function () { try { c.delete(KEY); } catch (e) {} return gz(url); });
        }, function () { return plain(url); });
      });
    });
  }
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || String(input);
    if (nameOf(url) === 'index.wasm') return engine(url);
    return nativeFetch(input, init);
  };
};
</script>
<script>
/* ---- works when opened directly from disk (file://) or from a local app asset folder:
   the engine files are embedded in index.embed.js and served to the engine from memory ---- */
window.BAREQ_EMBED = window.BAREQ_EMBED || {};
window.BAREQ_EMBED_TXT = window.BAREQ_EMBED_TXT || {};
